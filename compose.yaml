# Local Postgres for the eval harness.
#
# The project name is pinned rather than derived from the directory, and the
# container name is left to compose. That combination is what makes a second
# checkout of this repo *reuse* this database instead of colliding with it -- and
# "clone it and run `make eval`" is the project's own reproducibility claim, so
# the first thing a second checkout does must not be an error. Sharing is safe
# here because every ingest reloads the whole corpus from the manifest.
name: fi-rag-eval

services:
  postgres:
    image: postgres:17-alpine
    # Port 5434 deliberately: 5432 and 5433 belong to unrelated projects on this
    # machine, and this container must never be confused with one of those.
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: fi_rag_eval
      POSTGRES_PASSWORD: fi_rag_eval
      POSTGRES_DB: fi_rag_eval
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fi_rag_eval -d fi_rag_eval"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # The corpus is rebuilt from the manifest on every ingest, so there is
      # nothing here worth persisting -- and nothing here that can go stale.
      - /var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # The LLM boundary (slice 5, D10). Everything the harness sends to Groq goes
  # through this gateway, so the cost ceiling has an enforcer that is not our
  # own code and not a billing dashboard.
  # ---------------------------------------------------------------------------

  litellm-postgres:
    # A SECOND Postgres, deliberately, rather than a second database inside the
    # corpus one. The two have opposite persistence requirements and one
    # container can only have one policy: the corpus must NOT survive (it is
    # dropped and rebuilt by `create_schema` on every ingest, and tmpfs makes
    # that visible), while the proxy's spend ledger must survive, or the budget
    # resets to zero every `make db-down` and stops being a monthly cap.
    #
    # THE NAME NO LONGER DESCRIBES EVERYTHING IT HOLDS (ADR-0013). Since the demo
    # gained an access gate, this container also holds the `demo` database: the
    # tokens, the per-day counters and the monthly spend ceiling. That state has
    # the SAME persistence requirement as the ledger -- a cap that forgets on
    # restart is not a cap -- so by the rule above it belongs in this container
    # and not in the corpus one, which is on tmpfs. Two separate databases, so
    # nothing of ours ever touches LiteLLM's own migrations. Renaming the service
    # to match was considered and rejected: it would change the gateway's
    # DATABASE_URL host, and this container holds the ledger the $25 ceiling is
    # enforced from. Better naming is not worth any risk to the enforcer.
    image: postgres:17-alpine
    # PUBLISHED as of ADR-0013, and bound to 127.0.0.1 EXPLICITLY -- unlike the
    # corpus database's "5434:5432", which binds every interface. This partially
    # reverses the original decision here ("No published port. Nothing outside
    # this compose project has any business reading the spend ledger"), and the
    # reversal is stated rather than quietly made: with the demo's state in this
    # container, `fi-rag-eval serve` is such a client, and it runs on the host
    # until tracer 4 moves it into compose. 5435 deliberately: 5432, 5433 and
    # 5434 are taken on this machine.
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - litellm-spend:/var/lib/postgresql/data

  litellm:
    # Pinned by digest, not by a moving tag. `main-stable` today is litellm
    # 1.98.0; the project's reproducibility claim is "clone it and run
    # `make eval`", and a floating tag would silently change the gateway --
    # including its provider price table, which the measured cost figure and
    # the token ceiling both depend on.
    image: ghcr.io/berriai/litellm@sha256:20b5044b619055374061a6d5b7b08754cad75aeabbf82ddf4f69cc0cf80ddaf4
    depends_on:
      litellm-postgres:
        condition: service_healthy
    # Port 4010 deliberately: 4000 is LiteLLM's own default, so it is the port
    # any *other* project's gateway on this machine would also take. Same
    # reasoning as the corpus database's 5434.
    ports:
      - "4010:4000"
    environment:
      # `:?` rather than a default: a missing key must fail `docker compose up`
      # loudly. An empty string here would produce a gateway that starts fine
      # and 401s on the first real call, mid-run.
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env -- see .env.example}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env -- see .env.example}
      DATABASE_URL: postgresql://litellm:litellm@litellm-postgres:5432/litellm
      # STORE_MODEL_IN_DB is deliberately unset. With it on, the model list can
      # be edited through the gateway's UI and the running configuration drifts
      # away from the file in this repository -- which is exactly the drift the
      # published numbers must not have. litellm.config.yaml is the only source
      # of truth for which models exist.
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      # The image ships neither curl nor wget, so the check goes through its own
      # Python. The first start runs database migrations, hence the long retry
      # budget rather than a long interval.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness').read()"
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  litellm-spend:
    # The spend ledger the budget enforcer reads. Survives `make db-down` on
    # purpose: a monthly cap that forgets on restart is not a monthly cap.
