[project]
name = "fi-rag-eval"
version = "0.0.0"
description = "Finnish-language QA over municipal waste regulations, with the evaluation harness as the product."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "psycopg[binary]>=3.2",
  "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fi_rag_eval"]

[dependency-groups]
dev = ["ruff>=0.15", "mypy>=1.19", "pytest>=8.4", "types-PyYAML>=6.0"]

[project.scripts]
fi-rag-eval = "fi_rag_eval.cli:main"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = ["requires_db: needs a live Postgres (see make db-up)"]
