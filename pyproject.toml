[project]
name = "fi-rag-eval"
version = "0.0.0"
description = "Finnish-language QA over municipal waste regulations, with the evaluation harness as the product."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  # The Python binding for libvoikko. It is a ctypes wrapper: the shared library
  # (`libvoikko1`) and the Finnish dictionary (`voikko-fi`) are SYSTEM packages
  # that `uv sync` cannot supply. See the README's system dependencies.
  "libvoikko>=4.3",
  # The LLM boundary (ADR-0009). Used as a library here AND run as the gateway
  # in compose.yaml: `completion_cost()` and the provider price table are what
  # make the cost ceiling a measured number rather than a hand-maintained one.
  "litellm>=1.98",
  # Declared explicitly although litellm already pulls it in: the CLI calls it
  # directly, and depending on a transitive dependency is depending on someone
  # else's decision not to drop it.
  "python-dotenv>=1.0",
  # LiteLLM's `num_retries` is tenacity-backed but tenacity is NOT installed by
  # litellm core -- it raises at the first retry. D10 counts that retry-with-backoff
  # as covering the guard-rail's requirement, so the dependency is load-bearing
  # rather than incidental. Measured, on the first real call through the gateway.
  "tenacity>=8.0",
  "psycopg[binary]>=3.2",
  "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fi_rag_eval"]

[dependency-groups]
dev = ["ruff>=0.15", "mypy>=1.19", "pytest>=8.4", "types-PyYAML>=6.0"]

[project.scripts]
fi-rag-eval = "fi_rag_eval.cli:main"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# libvoikko ships no type information. It is confined to `analyse.Morphology`,
# which is the only place in the codebase that touches it untyped.
[[tool.mypy.overrides]]
module = ["libvoikko.*", "libvoikko"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "requires_db: needs a live Postgres (see make db-up)",
  "requires_voikko: needs libvoikko1 + voikko-fi installed on the host",
]
