# Golden set -- Alueellinen jätehuoltolautakunta (Pirkanmaa), edition 1.5.2026 alkaen.
#
# ==============================================================================
# WHY A SECOND AUTHORITY, AND WHAT IT MEASURES THAT ONE COULD NOT
# ==============================================================================
#
# The two authorities use DIFFERENT WORDS FOR THE SAME THINGS. This is a
# **synonym** gap, not a morphology gap, and no analyser can bridge it --
# `keräysväline` and `jäteastia` share no stem, so slice 3's compound splitting
# is irrelevant here:
#
#     the bin            Lounais-Suomi: jäteastia      Pirkanmaa: keräysväline
#     shared bin         Lounais-Suomi: yhteinen       Pirkanmaa: kimppa
#                                       jäteastia
#     off-route point    Lounais-Suomi: aluekeräys-    Pirkanmaa: aluejätepiste
#                                       piste
#     neighbourhood      Lounais-Suomi: kortteli-      Pirkanmaa: lähikeräys-
#     collection                        keräys                    järjestelmä
#
# Slice 3 drove zero-overlap misses from 4 to 0. This file is expected to reopen
# that class for a DIFFERENT MECHANISM WITH A DIFFERENT FIX, and measuring that
# is the whole reason this slice came before the vector layer.
#
# ==============================================================================
# PAIRED QUESTIONS
# ==============================================================================
#
# Eight questions in this file carry a `pair:` slug and are labelled TWICE -- the
# same question text, once here and once in lounais-suomi.yaml. They were chosen
# on topics where the two authorities' rules genuinely differ AND their
# vocabulary forks, and they carry three jobs at once:
#
#   1. the authority hard filter: identical text, two jurisdictions, and the
#      required chunks must differ;
#   2. `DESIGN.md:96`'s "answer differs between authorities" category, which had
#      zero questions before this slice;
#   3. the synonym measurement above.
#
# Loading enforces that a pair has exactly two halves, identical text, and
# different authorities -- so "the same question retrieves different rules" is a
# checked property, not an eyeballed one.
#
# ==============================================================================
# PROVENANCE
# ==============================================================================
#
# `phrasing: harvested` means the wording is copied VERBATIM from a public
# resident-facing page and `phrasing_source` names it. Four questions here are
# harvested, all from the operator's own FAQ. The Pirkanmaa authority publishes
# no resident FAQ of its own and its operator's other FAQ is entirely about
# biojäte -- which this file deliberately avoids, because biojäte and
# kompostointi are already 11 of the 21 Lounais-Suomi questions. The honest
# consequence is FEWER harvested questions, recorded as such: no authored
# question has been relabelled `harvested` to make the share look better.
#
# LABELS ARE HAND-WRITTEN FROM THE SOURCE PDF. `label_source` names the clause
# and the sentence each was read from. No label was taken from, checked against,
# or adjusted after seeing retriever output; question text was fixed before the
# target clause was looked up.
#
# NOT LABELLED HERE, DELIBERATELY: **18 § KOMPOSTOINTI**. The document's body
# carries a clause `18 a § KOMPOSTOINTI-ILMOITUS` that its own table of contents
# does not list, so it is absorbed into 18 §'s chunk and two clauses share one
# address. See REVIEW-DEBT.md. Nothing here points at that chunk.
