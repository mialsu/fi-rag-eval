        chunk: lounais-suomi@2024-08-01#6
    forbidden:
      - Velvoitteen esittäminen kaikkia kiinteistöjä koskevana kuljetusmuodosta riippumatta.
    label_source: >-
      6 § Kiinteistökohtaiset jäteastiat: "Kaikilla kiinteistöittäisen jätteenkuljetuksen
      piiriin kuuluvilla kiinteistöillä tulee olla käytössään vähintään sekajätteelle
      tarkoitettu jäteastia." Ehto on kuljetuksen piiriin kuuluminen, ei kiinteistö sinänsä.

  - id: kuka-hankkii-jateastiat
    question: Kuka hankkii jäteastiat?
