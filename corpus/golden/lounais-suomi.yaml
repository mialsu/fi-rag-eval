    label_source: >-
      6 §: "Kunnan järjestämässä jätteenkuljetuksessa LSJH toimittaa jäteastiat niille
      kiinteistöille, joilla käytetään käsin siirrettäviä 140-660 litran jäteastioita.";
      "Kunnan järjestämässä jätteenkuljetuksessa muiden kuin käsin siirrettävien
      pinta-astioiden hankinnasta kiinteistölle vastaa kiinteistön haltija."

  - id: pelkka-jatesakki
    question: Riittääkö pelkkä jätesäkki?
