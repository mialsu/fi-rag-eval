      ympäristönsuojeluviranomaiselle viimeistään kaksi viikkoa ennen tapahtumaa. Ilmoituksen
      ja jätehuoltosuunnitelman tekee tapahtuman järjestäjä."; "Monipäiväisissä tilaisuuksissa
      jäteastiat on lähtökohtaisesti tyhjennettävä ja alue siivottava vähintään kerran
      päivässä." Pirkanmaan 43 § jättää suunnitelman viranomaisen harkintaan -- aito
      sääntöero, ei sanaero.
