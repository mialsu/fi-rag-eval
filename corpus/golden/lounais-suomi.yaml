# Golden set -- Lounais-Suomen jätehuoltolautakunta, in force 1.8.2024.
#
# ==============================================================================
# HOW THESE QUESTIONS WERE WRITTEN, AND WHY IT IS THE MOST IMPORTANT THING HERE
# ==============================================================================
#
# The first version of this file was written with the source PDF open. Measured
# consequence: 60% of each question's stemmed content words appeared verbatim in
# its own target chunk, against 39% for real questions harvested from the
# authority's resident-facing pages. The harness was ~1.5x easier than the task,
# and blind to the vocabulary gap it exists to measure.
#
# This version is built two ways, recorded per question in `phrasing`:
#
#   harvested -- the wording is copied VERBATIM from a public resident-facing
#                page, written by the authority for residents and entirely
#                independent of my reading of the regulations. `phrasing_source`
#                names the page. These questions cannot be circular: nobody
#                consulted the target chunk to write them.
#
#   authored  -- I wrote it, under one rule taken from the harvested sample:
#                *name the thing with the document's noun, ask with a person's
#                verb.* Real questions leak the topic noun (`biojät`,
#                `kompostor`) because that is what the thing is called; they do
#                not leak the statutory register (`tyhjennettäv`, `ilmoitettav`,
#                `enin`). Several are phrased in words the document never uses
#                at all -- "taloyhtiö", "asunto", "mökki", "keskusta" -- because
#                that is what residents say.
#
# `make eval` reports lexical leakage every run and the gate fails if it RISES.
# ~40% is the floor, not 0%: driving it to zero would mean questions that avoid
# naming their own subject.
#
# LABELS ARE STILL HAND-WRITTEN FROM THE SOURCE. `label_source` names the clause
# and sentence each was read from. No label was taken from, checked against, or
# adjusted after seeing retriever output. Question text was frozen before the
# target clause was looked up, so the phrasing cannot have been fitted to it.
#
# `required_chunks` is the set the answer cannot be correct without -- not every
# chunk that mentions the topic. `required_branches` and `forbidden` follow
# ADR-0003 and are validated but not scored until the answering slice.
version: 1
questions:
  # ---------------------------------------------------------------- harvested
  - id: biojatteen-kerays-jarjestaminen
    question: Miten biojätteen keräys tulee järjestää?
    phrasing: harvested
    phrasing_source: https://lsjh.fi/lajittelu-ja-neuvonta/biojatteen-erilliskerays/
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#15
    required_branches:
      - claim: >-
          Biojätteelle on järjestettävä erillinen jäteastia, kun kiinteistöllä on yksi tai
          useampi huoneisto ja kiinteistö sijaitsee yli 10 000 asukkaan taajamassa.
        chunk: lounais-suomi@2024-08-01#15
      - claim: >-
          Velvoite ei koske kiinteistöä, jonka biojätteet kompostoidaan 17 §:n mukaisesti.
        chunk: lounais-suomi@2024-08-01#15
      - claim: >-
          Kiinteistö, jota velvoite ei koske, voi liittyä erilliskeräykseen vapaaehtoisesti
          sopimalla siitä LSJH:n kanssa.
        chunk: lounais-suomi@2024-08-01#15
    forbidden:
      - Väite, että biojätteen erilliskeräys koskee jokaista kiinteistöä.
      - Kiinteistön taajamasijainnin ratkaiseminen kysyjän puolesta.
    label_source: >-
      15 § velvoitetaulukko, rivi "1 tai enemmän / yli 10 000 asukkaan taajamassa"
      sarakkeessa "Biojäte"; sama pykälä: "Biojätteiden erilliskeräysvelvoite ei koske
      kiinteistöjä, joiden biojätteet kompostoidaan näiden määräysten 17 §:n mukaisesti."

  - id: kerata-vai-kompostoida
    question: Kerätä vai kompostoida?
    phrasing: harvested
    phrasing_source: https://lsjh.fi/lajittelu-ja-neuvonta/biojatteen-erilliskerays/
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#15
      - lounais-suomi@2024-08-01#17
    required_branches:
      - claim: >-
          Kompostointi on vaihtoehto erilliskeräykselle: erilliskeräysvelvoite ei koske
          kiinteistöä, jonka biojätteet kompostoidaan 17 §:n mukaisesti.
        chunk: lounais-suomi@2024-08-01#15
      - claim: >-
          Kompostoinnin on tapahduttava niitä varten suunnitellussa suljetussa ja
          ilmastoidussa kompostorissa, johon eläimet eivät pääse.
        chunk: lounais-suomi@2024-08-01#17
    forbidden:
      - Väite, että mikä tahansa kompostointi korvaa erilliskeräyksen.
    label_source: >-
      15 §:n vapautuslause yhdessä 17 §:n kanssa: "Biojätteitä saa kompostoida vain niitä
      varten suunnitellussa suljetussa ja ilmastoidussa kompostorissa, johon eläimet eivät
      pääse." Kaksi pykälää, koska 15 § ei kerro mitä "17 §:n mukaisesti" tarkoittaa.

  - id: miksi-biojatteet-pakataan
    question: Miksi biojätteet pitää pakata?
    phrasing: harvested
    phrasing_source: https://lsjh.fi/lajittelu-ja-neuvonta/biojatteen-erilliskerays/
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#25
    required_branches:
      - claim: >-
          Biojäte on pakattava biohajoavaan pussiin, kuten paperipussiin, ennen sen
          sijoittamista biojäteastiaan.
        chunk: lounais-suomi@2024-08-01#25
      - claim: Biojäteastiaan ei saa laittaa nestemäistä biojätettä.
        chunk: lounais-suomi@2024-08-01#25
    forbidden:
      - Muovipussin esittäminen sallittuna biojätteen pakkauksena.
    label_source: >-
      25 § Jäteastioiden täyttäminen: "Biojäte on pakattava biohajoavaan pussiin kuten
      esimerkiksi paperipussiin ennen sen sijoittamista biojäteastiaan.";
      "Biojäteastiaan ei saa laittaa nestemäistä biojätettä."

  - id: kompostoinnin-aloittaminen
    question: Miten aloittaa kompostointi?
    phrasing: harvested
    phrasing_source: https://lsjh.fi/mita-haluat-lajitella/kompostointi/
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#17
      - lounais-suomi@2024-08-01#18
    required_branches:
      - claim: >-
          Biojätteitä saa kompostoida vain niitä varten suunnitellussa suljetussa ja
          ilmastoidussa kompostorissa, johon eläimet eivät pääse.
        chunk: lounais-suomi@2024-08-01#17
      - claim: >-
          Aloittamisesta on ilmoitettava jätehuoltoviranomaiselle kahden kuukauden sisällä.
        chunk: lounais-suomi@2024-08-01#18
    forbidden:
      - Ilmoitusvelvollisuuden jättäminen mainitsematta.
    label_source: >-
      17 §:n kompostorivaatimukset yhdessä 18 §:n ilmoitusvelvollisuuden kanssa: "Jätteen
      haltijan on ilmoitettava jätehuoltoviranomaiselle vähintään kahden kuukauden sisällä
      biojätteiden kompostoinnin aloittamisesta." Kaksi pykälää, koska aloittaminen on sekä
      tekninen että hallinnollinen toimi.

  - id: mita-kompostoriin-laitetaan
    question: Mitä kompostoriin laitetaan?
    phrasing: harvested
    phrasing_source: https://lsjh.fi/mita-haluat-lajitella/kompostointi/
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#17
    required_branches:
      - claim: >-
          Kompostoriin saa laittaa ainoastaan kompostoituvia jätteitä, jotka eivät haittaa
          valmiin kompostituotteen käyttöä kiinteistöllä.
        chunk: lounais-suomi@2024-08-01#17
      - claim: >-
          Kiinteistöllä saa kompostoida siellä syntyviä biojätteitä, kuivakäymäläjätteitä ja
          puutarhajätteitä; kuivakäymäläjäte ja lemmikkien ulosteet vaativat suljetun ja
          hyvin ilmastoidun kompostorin, jonka valumavesien pääsy maahan on estetty.
        chunk: lounais-suomi@2024-08-01#17
    forbidden:
      - Haitallisten vieraslajien lisääntymiskykyisten kasvinosien esittäminen sallittuna.
    label_source: >-
      17 § Kompostointi: "Kompostoriin ja puutarhajätteen kompostiin saa laittaa ainoastaan
      kompostoituvia jätteitä, jotka eivät haittaa valmiin kompostituotteen käyttöä
      kiinteistöllä."; "Kuivakäymäläjätteitä, lemmikkieläinten ulosteita ... saa kompostoida
      vain niitä varten suunnitellussa suljetussa ja hyvin ilmastoidussa kompostorissa."

  - id: kompostorin-valinta
    question: Miten kompostori valitaan?
    phrasing: harvested
    phrasing_source: https://lsjh.fi/mita-haluat-lajitella/kompostointi/
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#17
    required_branches:
      - claim: >-
          Kompostorin on oltava biojätteille suunniteltu, suljettu ja ilmastoitu, eivätkä
          eläimet saa päästä siihen.
        chunk: lounais-suomi@2024-08-01#17
      - claim: >-
          Tilavuuden tulee riittää kaikkien kompostoria käyttävien biojätteille, kylmien
          vuodenaikojen hidastuminen huomioiden.
        chunk: lounais-suomi@2024-08-01#17
      - claim: >-
          Kompostori voi olla enintään viiden asuinhuoneiston tai vapaa-ajan asunnon
          yhteinen, ja käyttäjien asunnot enintään kilometrin etäisyydellä siitä.
        chunk: lounais-suomi@2024-08-01#17
    forbidden:
      - Avonaisen kompostorin esittäminen biojätteelle sallittuna.
    label_source: >-
      17 §: "Biojätteitä saa kompostoida vain niitä varten suunnitellussa suljetussa ja
      ilmastoidussa kompostorissa, johon eläimet eivät pääse. Kompostorin tilavuuden tulee
      riittää ..."; "Biojätteen kompostori voi olla enintään viiden asuinhuoneiston tai
      vapaa-ajan asunnon yhteinen." Avonainen kompostori on sallittu vain puutarhajätteelle.

  # ----------------------------------------------------------------- authored
  - id: biojateastian-tyhjennys-kesalla
    question: Kuinka usein biojäteastia tyhjennetään kesällä?
    phrasing: authored
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#26
    required_branches:
      - claim: Kesäaikana (viikot 18-40) biojäteastia on tyhjennettävä vähintään kahden viikon välein.
        chunk: lounais-suomi@2024-08-01#26
      - claim: >-
          Tuulettuvaan biojäteastiaan, syväkeräysastiaan tai jäähdytettyyn jätehuoneeseen
          sijoitettuun astiaan kerättävällä biojätteellä pisin tyhjennysväli on neljä viikkoa.
        chunk: lounais-suomi@2024-08-01#26
    forbidden:
      - Yhden tyhjennysvälin ilmoittaminen mainitsematta astiatyypin poikkeusta.
      - Talviajan poikkeuksen esittäminen kesäaikaa koskevana.
    label_source: >-
      26 § tyhjennysvälitaulukko: rivi "Biojäte" sarake kesäaika = 2 viikkoa; rivi "Biojäte,
      joka kerätään tuulettuvaan biojäteastiaan, syväkeräysastiaan, tai jäähdytettyyn
      jätehuoneeseen sijoitettuihin jäteastioihin" = 4 viikkoa.

  - id: biojateastian-pesu
    question: Montako kertaa vuodessa biojäteastia pestään?
    phrasing: authored
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#27
    required_branches:
      - claim: Biojäteastia on puhdistettava vähintään kaksi kertaa vuodessa.
        chunk: lounais-suomi@2024-08-01#27
      - claim: >-
          Kiinteistöittäisessä jätteenkuljetuksessa jäteastioiden kunnosta ja puhdistuksesta
          huolehtii kiinteistön haltija.
        chunk: lounais-suomi@2024-08-01#27
    forbidden:
      - Tyhjennysvälin (26 §) esittäminen pesutiheytenä.
    label_source: >-
      27 § Jäteastioiden kunnossapito ja pesu: "Sekajäteastia on kuitenkin puhdistettava
      vähintään kerran vuodessa ja biojäteastia vähintään kaksi kertaa vuodessa."
      Tarkoituksellinen avainsana-ansa: "biojäteastia" esiintyy myös 25 §:ssä ja 26 §:ssä,
      ja "pesu" myös 23 §:ssä.

  - id: biojate-mita-tarkoittaa
    question: Mitä biojäte tarkoittaa?
    phrasing: authored
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#2.biojatteella
    required_branches:
      - claim: >-
          Biojätteellä tarkoitetaan biologisesti hajoavaa elintarvike- ja keittiöjätettä ja
          elintarviketuotannossa syntyvää vastaavaa jätettä.
        chunk: lounais-suomi@2024-08-01#2.biojatteella
      - claim: >-
          Määräysten määritelmä poikkeaa jätelaista siten, ettei se sisällä puutarha- ja
          puistojätettä.
        chunk: lounais-suomi@2024-08-01#2.biojatteella
    forbidden:
      - Puutarhajätteen esittäminen biojätteen määritelmään kuuluvana.
    label_source: >-
      2 § Määritelmät, kappale "Biojätteellä biologisesti hajoavaa elintarvike- ja
      keittiöjätettä ... (Määritelmä poikkeaa jätelain mukaisesta biojätteen määritelmästä
      siten, että se ei sisällä puutarha- ja puistojätettä.)"

  - id: mika-on-taajama
    question: Mikä on taajama?
    phrasing: authored
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#2.taajamalla
    required_branches:
      - claim: >-
          Taajamalla tarkoitetaan rakennusryhmää, jossa on vähintään 200 asukasta ja jossa
