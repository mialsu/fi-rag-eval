        chunk: lounais-suomi@2024-08-01#2.taajamalla
    forbidden:
      - Yksittäisen kiinteistön taajamasijainnin ratkaiseminen määritelmän perusteella.
    label_source: >-
      2 § Määritelmät: "Taajamalla rakennusryhmää, jossa on vähintään 200 asukasta ja jossa
      rakennusten välinen etäisyys on yleensä enintään 200 metriä." Lyhyt määritelmächunk,
      jonka 26 §:n kaltaiset pitkät pykälät voittavat ts_rankissa.

  - id: taloyhtio-kolme-asuntoa-biojate
    question: >-
      Meillä on taloyhtiössä kolme asuntoa keskustassa. Tarvitaanko biojäteastia?
    phrasing: authored
    municipality: Turku
    required_chunks:
      - lounais-suomi@2024-08-01#13
      - lounais-suomi@2024-08-01#15
    required_branches:
      - claim: >-
          Biojäte on lajiteltava erikseen kiinteistöillä, jotka kuuluvat 15 tai 16 §:n mukaan
          erilliskeräyksen piiriin tai jotka kompostoivat biojätteet 17 §:n mukaisesti.
        chunk: lounais-suomi@2024-08-01#13
      - claim: >-
          Ratkaisevaa ei ole asuntojen määrä vaan taajama: yli 10 000 asukkaan taajamassa
          raja on yksi huoneisto, joten kolmen asunnon kiinteistö kuuluu velvoitteen piiriin
          siellä ja jää sen ulkopuolelle muualla.
        chunk: lounais-suomi@2024-08-01#15
      - claim: >-
          Jos kiinteistö ei kuulu erilliskeräyksen piiriin eikä kompostoi, biojätteet
          laitetaan sekajäteastiaan.
        chunk: lounais-suomi@2024-08-01#13
    forbidden:
      - Viiden huoneiston rajan esittäminen biojätettä koskevana.
      - Vastaaminen kertakaikkisella kyllä tai ei ilman taajamaehtoa.
      - Sanan "keskusta" tulkitseminen yli 10 000 asukkaan taajamaksi ilman karttatietoa.
    label_source: >-
      13 §: "Biojätteet on lajiteltava erikseen kiinteistöillä, jotka kuuluvat näiden
      jätehuoltomääräysten 15 tai 16 §:n mukaan ... tai jotka kompostoivat ...";
      "Jos biojätettä ei kompostoida ... tulee biojätteet laittaa sekajätteen jäteastiaan."
      15 §: velvoitetaulukon huoneistorajat. Kysymys on tarkoituksella asukkaan sanoilla:
      "taloyhtiö", "asunto" ja "keskusta" eivät esiinny määräyksissä lainkaan.

  - id: sekajateastia-pakollinen
